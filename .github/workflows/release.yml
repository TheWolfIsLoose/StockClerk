name: Release

# Fires on every pushed tag, and on pushes to dev / main. On a branch push
# the version comes from the top `## vX.Y.Z` heading in CHANGELOG.md; if
# that tag doesn't exist yet the workflow creates it, then releases.
# Prerelease versions (-alpha/-beta/-preview/-rc) only ship from dev,
# stable versions only from main. A tag that exists but has no published
# release (e.g. a failed run) is released from its tagged commit.
# Then, for the tag:
#   1. Packages the addon (BigWigsMods packager, same tool CurseForge
#      uses internally) so the zip attached to the GitHub Release is
#      structurally identical to what CF publishes.
#   2. Creates the GitHub Release itself with notes drawn from the
#      matching CHANGELOG section.
#
# Prereleases: tags like v0.8.0-alpha1 or v0.8.0-preview3 are marked
# as prereleases automatically. Stable tags like v1.0.0 are marked
# as latest.
#
# Not wired to publish to CurseForge -- that path is handled by the
# GitHub -> CurseForge webhook already configured on this repo. This
# workflow only exists to keep GitHub Releases in sync with git tags.

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(grep -m1 -oE '^## v[0-9][^ ]*' CHANGELOG.md | cut -c4-)
          if [ -z "$TAG" ]; then
            echo "No '## vX.Y.Z' heading in CHANGELOG.md; nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo none)
            if [ "$DRAFT" = "false" ]; then
              echo "$TAG is already released; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Tag exists but its release is missing or a leftover draft from
            # a failed run: release it from the tagged commit.
            [ "$DRAFT" = "true" ] && gh release delete "$TAG" --yes
            git checkout -q "$TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          PRE=false
          [[ "$TAG" =~ -(alpha|beta|preview|rc) ]] && PRE=true
          if [ "$GITHUB_REF_NAME" = "dev" ] && [ "$PRE" = false ]; then
            echo "$TAG is a stable version; stable releases ship from main only."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF_NAME" = "main" ] && [ "$PRE" = true ]; then
            echo "$TAG is a prerelease; prereleases ship from dev only."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # Pushed with GITHUB_TOKEN, so it does not re-trigger this workflow.
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        if: steps.tag.outputs.skip != 'true'
        id: notes
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Building release notes for tag: $TAG"
          # Strip leading 'v' for CHANGELOG section header match.
          SECTION="${TAG#v}"
          # Pull the section between `## vX.Y.Z` and the next `## ` or `---`.
          awk -v section="$SECTION" '
            $0 == "## v" section {flag=1; next}
            /^## |^---/ {if (flag) exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG entry found for $TAG; using tag message."
            git tag -l --format='%(contents)' "$TAG" > /tmp/release-notes.md
          fi
          head -5 /tmp/release-notes.md

      - name: Detect prerelease
        if: steps.tag.outputs.skip != 'true'
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* || "$TAG" == *"-preview"* || "$TAG" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package addon (BigWigsMods packager)
        if: steps.tag.outputs.skip != 'true'
        # Packages the addon following .pkgmeta rules, producing a zip
        # in .release/ that matches CurseForge's own build output.
        # Run release.sh directly (what the packager action does) so the
        # ref can be presented as the tag: on a branch push the packager
        # otherwise sees a tag at HEAD and skips, expecting a tag-push run.
        # -d: no CurseForge upload (webhook handles that)
        # -w: no WoWInterface upload
        # -a: no Wago upload (no Wago project configured)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          curl -fsSL https://raw.githubusercontent.com/BigWigsMods/packager/master/release.sh -o /tmp/release.sh
          GITHUB_REF="refs/tags/$TAG" GITHUB_REF_NAME="$TAG" GITHUB_REF_TYPE=tag \
            bash /tmp/release.sh -d -w -a

      - name: Create GitHub Release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.prerelease.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Attach any zip the packager produced (usually a single file
          # in .release/).
          ZIP_FILES=(.release/*.zip)
          # On failure, surface gh's message as a public annotation so it can
          # be read from the run summary without the (sign-in only) logs.
          if ! OUT=$(gh release create "$TAG" \
              "${ZIP_FILES[@]}" \
              --title "Stock Clerk $TAG" \
              --notes-file /tmp/release-notes.md \
              $PRERELEASE_FLAG 2>&1); then
            echo "::error title=gh release create::${OUT//$'\n'/%0A}"
            exit 1
          fi
          echo "$OUT"
